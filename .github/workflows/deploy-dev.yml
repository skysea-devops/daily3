# Path: .github/workflows/deploy-dev.yml
name: Deploy (dev)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - closed
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "app-backend/**"
      - "app-frontend/**"
      - ".github/workflows/deploy-dev.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: read

# PR to main   → dev environment (plan only)
# merge to main → dev environment (apply + deploy)

jobs:
  build-lambdas:
    name: Build Lambda functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app-backend/package-lock.json

      - name: Install dependencies
        working-directory: app-backend
        run: npm ci

      - name: Type check
        working-directory: app-backend
        run: npm run typecheck

      - name: Unit tests
        working-directory: app-backend
        run: npm test

      - name: Build
        working-directory: app-backend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-dist
          path: app-backend/lambdas/**/dist/
          retention-days: 1

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app-frontend/package-lock.json

      - name: Install dependencies
        working-directory: app-frontend
        run: npm ci

      - name: Debug environment variables
        run: |
          echo "POOL_ID length: ${#NEXT_PUBLIC_COGNITO_USER_POOL_ID}"
          echo "CLIENT_ID length: ${#NEXT_PUBLIC_COGNITO_CLIENT_ID}"
          echo "API_URL: $NEXT_PUBLIC_API_BASE_URL"
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Build
        working-directory: app-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: app-frontend/out/
          retention-days: 1

      # Kilitli deneme bölümleri (npm run build → prebuild üretir). out/'a GİRMEZ;
      # ayrı artifact olarak deploy job'ına taşınır ve PRIVATE bucket'a yüklenir.
      # Sızıntı kontrolü (postbuild) zaten build adımında koştu ve geçti.
      - name: Upload locked essay bodies
        uses: actions/upload-artifact@v4
        with:
          name: essays-private
          path: app-frontend/.essays-private/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [build-lambdas, build-frontend]
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-dist
          path: app-backend/lambdas

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=daily3-dev-tfstate" \
            -backend-config="key=daily3/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Polar sirlari yalnizca SSM parametresi ILK olusturulurken kullanilir
          # (polar.tf, ignore_changes = all). Sonrasi: aws ssm put-parameter.
          TF_VAR_polar_access_token: ${{ secrets.POLAR_ACCESS_TOKEN }}
          TF_VAR_polar_webhook_secret: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          # Terraform degiskeninin adi trial_ledger_secret (infra/terraform/variables.tf).
          # Tanimsiz bir TF_VAR_ Terraform tarafindan SESSIZCE yok sayilir — yanlis
          # isim hata vermez, sadece Lambda baska bir anahtar kullanir.
          TF_VAR_trial_ledger_secret: ${{ secrets.TRIAL_IDENTITY_HMAC_SECRET }}
        run: terraform plan -var-file=dev.tfvars -out=tfplan

      - name: Terraform Apply
        if: github.event.pull_request.merged == true
        env:
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Polar sirlari yalnizca SSM parametresi ILK olusturulurken kullanilir
          # (polar.tf, ignore_changes = all). Sonrasi: aws ssm put-parameter.
          TF_VAR_polar_access_token: ${{ secrets.POLAR_ACCESS_TOKEN }}
          TF_VAR_polar_webhook_secret: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          # Terraform degiskeninin adi trial_ledger_secret (infra/terraform/variables.tf).
          # Tanimsiz bir TF_VAR_ Terraform tarafindan SESSIZCE yok sayilir — yanlis
          # isim hata vermez, sadece Lambda baska bir anahtar kullanir.
          TF_VAR_trial_ledger_secret: ${{ secrets.TRIAL_IDENTITY_HMAC_SECRET }}
        run: terraform apply -auto-approve tfplan

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: [build-frontend, terraform]
    environment: dev
    if: github.event.pull_request.merged == true
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: out/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: |
          find out/ -name "*.txt" -delete

          find out/ -name "*.html" | while read f; do
            key="${f#out/}"
            aws s3 cp "$f" "s3://${{ vars.FRONTEND_BUCKET_NAME }}/$key" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache, no-store, must-revalidate"
          done

          aws s3 sync out/_next/ "s3://${{ vars.FRONTEND_BUCKET_NAME }}/_next/" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 sync out/ "s3://${{ vars.FRONTEND_BUCKET_NAME }}/" \
            --exclude "_next/*" \
            --exclude "*.html" \
            --exclude "*.txt" \
            --cache-control "public, max-age=3600"

      - name: Download locked essay bodies
        uses: actions/download-artifact@v4
        with:
          name: essays-private
          path: essays-private/

      # Bucket adı Terraform'daki kuralla aynı (infra/terraform/essays.tf):
      # <project>-<env>-essays-private-<account id>. Public erişimi kapalı.
      - name: Sync locked essay bodies
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="cogletta-dev-essays-private-$ACCOUNT_ID"
          aws s3 sync essays-private/ "s3://$BUCKET/essays/" \
            --delete \
            --exclude "*" --include "*.json" \
            --content-type "application/json" \
            --cache-control "private, no-store" \
            --sse AES256

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
  subscription-regression:
    name: Subscription regression (dev)
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    environment: dev
    # Test sabit bir e-posta kullaniyor (SES simulator). Iki kosu ayni anda
    # calisirsa ayni Cognito kullanicisi ve ayni TRIAL# defter kaydi uzerinde
    # yarisirlar. Sirayla calissinlar; onceki kosu iptal EDILMEMELI, yoksa
    # teardown yarida kalir ve defter kaydi kalici olarak asili kalir.
    concurrency:
      group: subscription-regression-dev
      cancel-in-progress: false
    # Only run destructive DEV lifecycle tests after an actual merged deploy.
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: app-backend
        run: npm ci

      - name: Build backend for race-path regression
        working-directory: app-backend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve deployed DEV resources
        shell: bash
        run: |
          set -euo pipefail

          USER_POOL_ID="$(aws cognito-idp list-user-pools \
            --max-results 60 \
            --query "UserPools[?Name=='cogletta-dev-user-pool'].Id | [0]" \
            --output text)"

          if [[ -z "$USER_POOL_ID" || "$USER_POOL_ID" == "None" ]]; then
            echo "Could not resolve cogletta-dev-user-pool" >&2
            exit 1
          fi

          CLIENT_ID="$(aws cognito-idp list-user-pool-clients \
            --user-pool-id "$USER_POOL_ID" \
            --max-results 60 \
            --query "UserPoolClients[?ClientName=='cogletta-dev-web-client'].ClientId | [0]" \
            --output text)"

          API_BASE_URL="$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='cogletta-dev-backend-api'].ApiEndpoint | [0]" \
            --output text)"

          if [[ -z "$CLIENT_ID" || "$CLIENT_ID" == "None" ]]; then
            echo "Could not resolve cogletta-dev-web-client" >&2
            exit 1
          fi
          if [[ -z "$API_BASE_URL" || "$API_BASE_URL" == "None" ]]; then
            echo "Could not resolve cogletta-dev-backend-api" >&2
            exit 1
          fi

          # The frontend is compiled with NEXT_PUBLIC_API_BASE_URL. Catch a
          # deployment variable accidentally pointing DEV at another backend.
          CONFIGURED_API_URL='${{ vars.NEXT_PUBLIC_API_BASE_URL }}'
          if [[ -n "$CONFIGURED_API_URL" && "${CONFIGURED_API_URL%/}" != "${API_BASE_URL%/}" ]]; then
            echo "DEV frontend API variable does not match the deployed DEV API" >&2
            echo "Configured: $CONFIGURED_API_URL" >&2
            echo "Resolved:   $API_BASE_URL" >&2
            exit 1
          fi

          # Webhook secret'in tek dogru kaynagi SSM (polar.tf). Test, Lambda'nin
          # dogruladigi degerle imzalasin diye oradan okunur.
          POLAR_WEBHOOK_SECRET="$(aws ssm get-parameter --with-decryption \
            --name /cogletta/dev/polar/webhook-secret \
            --query Parameter.Value --output text)"
          echo "::add-mask::$POLAR_WEBHOOK_SECRET"
          if [[ -z "$POLAR_WEBHOOK_SECRET" || "$POLAR_WEBHOOK_SECRET" == "CHANGE_ME" ]]; then
            echo "Polar webhook secret is not set in SSM (/cogletta/dev/polar/webhook-secret)" >&2
            exit 1
          fi

          {
            echo "POLAR_WEBHOOK_SECRET=$POLAR_WEBHOOK_SECRET"
            echo "SUBSCRIPTION_E2E_USER_POOL_ID=$USER_POOL_ID"
            echo "SUBSCRIPTION_E2E_CLIENT_ID=$CLIENT_ID"
            echo "SUBSCRIPTION_E2E_API_BASE_URL=$API_BASE_URL"
          } >> "$GITHUB_ENV"

      - name: Run DEV subscription state-machine regression
        working-directory: app-backend
        env:
          SUBSCRIPTION_E2E_APP_URL: https://dev.cogletta.com
          SUBSCRIPTION_E2E_USERS_TABLE_NAME: cogletta-dev-users
          # SES mailbox simulator: no real recipient receives test mail.
          SUBSCRIPTION_E2E_EMAIL: success@simulator.amazonses.com
          # Deneme defterinin HMAC anahtari. Test, kendi olusturdugu
          # TRIAL#<hmac(email)> kaydini teardown'da SILMEK zorunda: defter hesap
          # silinse bile kaliyor, dolayisiyla temizlenmezse sabit test e-postasi
          # ikinci kosuda deneme alamaz ve testler kalici kirmiziya duser.
          # Lambda ayni degeri TRIAL_LEDGER_SECRET adiyla goruyor; ikisini de
          # veriyoruz ki test hangi adi okursa okusun calissin.
          TRIAL_LEDGER_SECRET: ${{ secrets.TRIAL_IDENTITY_HMAC_SECRET }}
          TRIAL_IDENTITY_HMAC_SECRET: ${{ secrets.TRIAL_IDENTITY_HMAC_SECRET }}
          # normalizeEmail() ile ayni sonucu uretmek icin testin de bilmesi gerek.
          TRIAL_LEDGER_STRICT_ALIAS: "true"
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: node tests/subscription-dev-e2e.mjs